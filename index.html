<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
    <title>Sala de Estudos</title>
</head>
<body id="light-theme">
    <header>
        <button id="theme-toggle" onclick="updateTheme()">
            <img src="./public/assets/sun-moon.svg" alt="Botão com uma lua e um sol que ao clicar muda o tema da página">
        </button>
        <div class="div-time">
            <p id="time-id"></p>
        </div>
    </header>
    <div class="div-date">
        <p id="date-id"></p>
    </div>
    <footer>
        <button id="volume-toggle">
            <img src="./public/assets/volume.svg" alt="Botão com o icone de volume que ao clicar muta ou desmuta a música da página">
            <audio id="lofi-audio" src="./public/assets/mondamusic-lofi.mp3" loop></audio>
        </button>
    </footer>
</body>
</html>
